<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Pet Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== MENU ===== -->
<div id="menu" class="overlay">
  <h1>🐾 HTML PET SIMULATOR</h1>
  <button id="playBtn">▶️ Play</button>
  <button id="loadBtn">📂 Load Pet Data</button>
  <input type="file" id="loadInput" accept=".json" hidden>
</div>

<!-- ===== PET SELECT ===== -->
<div id="petSelect" class="overlay hidden">
  <h2>Select Your Pet</h2>
  <div class="petGrid">
    <button data-pet="chicken">🐔 Chicken</button>
    <button data-pet="capybara">🦫 Capybara</button>
    <button data-pet="cat">🐱 Cat</button>
    <button data-pet="Fox">🦊 Fox</button>
    <button data-pet="hamster">🐹 Hamster</button>
    <button data-pet="dingus">😼 Dingus</button>
  </div>
</div>

<!-- ===== GAME UI ===== -->
<div id="gameUI" class="hidden">
  <div id="leftUI">
    <button id="feed">🍖 Feed</button>
    <button id="play">🎾 Play</button>
    <button id="sleep">💤 Sleep</button>
    <button id="heal">❤️ Heal</button>
    <button id="save">💾 Save</button>
  </div>

  <div id="actions">
    <button id="zoomIn">➕ Zoom</button>
    <button id="zoomOut">➖ Zoom</button>
  </div>

  <div id="rightUI">
    Hunger: <span id="hunger">0</span><br>
    Fun: <span id="fun">0</span><br>
    Health: <span id="health">0</span><br>
    Energy: <span id="energy">0</span><br>
    Love: <span id="love">0</span>
  </div>

  <div id="scoreboard">
    ⭐ Score: <span id="scoreValue">0</span>
  </div>

  <button id="achievementBtn" class="floatingBtn">🏆</button>
  <button id="switchPetBtn" class="floatingBtn" style="right:70px">🐾</button>

  <div id="achievementBoard" class="overlay hidden">
    <h3>Achievements</h3>
    <ul id="achievementList"></ul>
    <button id="closeAchievement">Close</button>
  </div>

  <div id="leaderboard"></div>
</div>

<!-- ===== THREE.JS ===== -->
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/GLTFLoader.js"></script>

<script src="script.js"></script>
</body>
</html>
