<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Ihsan Bio</title>
  <link rel="stylesheet" href="/bio2assets/style.css">
</head>
<body>

<div id="intro">
  <div class="intro-text">click to see it 👀</div>
</div>

<!-- BUTTON GROUP -->
<div id="btn-group">
  <button id="pm-btn" class="neon-green">Send me a private message</button>
  <button id="insta-btn" class="neon-pink">My Insta</button>
  <button id="github-btn" class="neon-white">My GitHub</button>
  <button id="spotify-btn" class="neon-spotify">My Spotify Playlist</button>
  <button id="snake-btn" class="neon-green snake-btn">🐍</button>
  <button id="petsim-btn" class="neon-green snake-btn">🥚</button>
</div>

<!-- POPUP MESSAGE -->
<div id="popup">
  <div class="popup-box">
    <h3>Send Message</h3>
    <form id="email-form">
      <input type="text" name="from_name" placeholder="Your name" required>
      <input type="email" name="reply_to" placeholder="Your email" required>
      <textarea name="message" placeholder="Message" required></textarea>
      <div class="popup-actions">
        <button type="submit">Send</button>
        <button type="button" id="close-popup">Cancel</button>
      </div>
    </form>
  </div>
</div>

<!-- POPUP SPOTIFY -->
<div id="spotify-popup">
  <div class="spotify-box">
    <button id="close-spotify">✕</button>

    <iframe
      data-testid="embed-iframe"
      style="border-radius:12px"
      src="https://open.spotify.com/embed/playlist/1ZqrfEZAtN06bwh0JfZmHF?utm_source=generator"
      width="100%"
      height="352"
      frameBorder="0"
      allowfullscreen=""
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>
  </div>
</div>

<div class="container" id="main-content">
  <div id="typing-text"></div>
  <img id="manutd-logo" src="/bio2assets/manutd.png">
</div>

<audio id="bg-music" src="/bio2assets/airlock.mp3" loop></audio>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="/bio2assets/script.js"></script>
</body>
</html>
