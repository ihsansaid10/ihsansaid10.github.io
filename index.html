<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ihsan Bio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="explorer.css">
  <link rel="stylesheet" href="genie.css">
</head>
<body>

<!-- WALLPAPER -->
<div class="wallpaper" aria-hidden="true">
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
</div>

<!-- MENU BAR -->
<header id="menubar">
  <div class="menu-left"><span class="menu-logo"></span><strong>Ihsan Bio</strong></div>
  <div class="menu-right"><span id="menu-clock"></span></div>
</header>

<!-- LOCK SCREEN / INTRO -->
<button id="intro" type="button">
  <div class="lock-time" id="lock-time"></div>
  <div class="lock-date" id="lock-date"></div>
  <div class="intro-text" id="login-label">Log In →</div>
</button>

<!-- MAIN WINDOW -->
<main class="container" id="main-content">
  <section class="window">
    <div class="titlebar">
      <span class="lights" aria-hidden="true"><i class="red"></i><i class="yellow"></i><i class="green"></i></span>
      <span class="window-title">Ihsan Bio</span>
    </div>
    <div class="window-body">
      <img id="manutd-logo" src="manutd.png" alt="Manchester United logo">
      <div id="typing-text" aria-live="polite">
        <div class="tt"><span class="typed"></span><span class="caret"></span><span class="rest"></span></div>
      </div>
    </div>
  </section>
</main>

<!-- APP EXPLORER (jendela ala Finder, isinya dari CONFIG.apps) -->
<section id="explorer" role="dialog" aria-label="App Explorer" aria-hidden="true">
  <div class="xp-titlebar">
    <span class="xp-lights">
      <button type="button" id="xp-close" class="red" aria-label="Close"></button>
      <button type="button" id="xp-min" class="yellow" aria-label="Minimize"></button>
      <i class="green" aria-hidden="true"></i>
    </span>
    <span class="xp-title">App Explorer</span>
    <span class="xp-tools">
      <span class="xp-seg" role="group" aria-label="View">
        <button type="button" data-view="grid" aria-label="Icon view" aria-pressed="true">
          <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4" width="6.500" height="6.500" rx="1.500"/><rect x="13.500" y="4" width="6.500" height="6.500" rx="1.500"/><rect x="4" y="13.500" width="6.500" height="6.500" rx="1.500"/><rect x="13.500" y="13.500" width="6.500" height="6.500" rx="1.500"/></g></svg>
        </button>
        <button type="button" data-view="list" aria-label="List view" aria-pressed="false">
          <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></g></svg>
        </button>
      </span>
      <input id="xp-search" type="search" placeholder="Search" aria-label="Search apps" autocomplete="off">
    </span>
  </div>

  <div class="xp-body">
    <aside class="xp-sidebar" aria-label="Folders">
      <div class="xp-side-head">Favorites</div>
      <div id="xp-sidebar-list"></div>
    </aside>
    <div class="xp-content">
      <div id="xp-grid" class="xp-grid"></div>
    </div>
  </div>

  <footer class="xp-footer">
    <span class="xp-footer-info"><span id="xp-path">Apps</span><span id="xp-status"></span></span>
    <button type="button" id="xp-open" class="btn-primary" disabled>Open</button>
  </footer>
</section>

<!-- SUPPORT (di atas taskbar) -->
<div id="support-wrap">
  <a id="support-cta" class="pill" href="https://saweria.co/ihsansaid10" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.8 8.3 2.7 5 6 5c2 0 3.4 1 4.2 2.4h3.6C14.6 6 16 5 18 5c3.3 0 5.2 3.3 3.6 6.8C19.5 16.4 12 21 12 21z"/></svg>
    <span id="support-label">Support My Work</span>
  </a>
</div>

<!-- DOCK (tombol diisi dari config.js) -->
<nav id="btn-group" aria-label="Links">
  <span id="dock-apps"></span>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="power-btn" class="dock-item" data-label="Shut Down" aria-label="Shut Down">
    <span class="icon i-power"><svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v8"/><path d="M7.200 6.300a8 8 0 1 0 9.600 0"/></g></svg></span>
  </button>
</nav>

<!-- POPUP MESSAGE -->
<div id="popup">
  <div class="popup-box sheet">
    <h3>Send Message</h3>
    <form id="email-form">
      <input type="text" name="from_name" placeholder="Your name" required>
      <input type="email" name="reply_to" placeholder="Your email" required>
      <textarea name="message" placeholder="Message" required></textarea>
      <div class="popup-actions">
        <button type="button" id="close-popup" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">Send</button>
      </div>
    </form>
  </div>
</div>

<!-- POPUP SPOTIFY -->
<div id="spotify-popup">
  <div class="spotify-box sheet">
    <div class="titlebar">
      <button id="close-spotify" class="light-btn" aria-label="Close"></button>
      <span class="window-title">My Spotify Playlist</span>
    </div>
    <iframe
      data-testid="embed-iframe"
      style="border-radius:12px"
      src="https://open.spotify.com/embed/playlist/1ZqrfEZAtN06bwh0JfZmHF?utm_source=generator"
      width="100%"
      height="352"
      frameBorder="0"
      allowfullscreen=""
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>
  </div>
</div>

<!-- SHUTDOWN SCREEN -->
<div id="shutdown">
  <div class="sd-load">
    <div class="sd-spinner"></div>
    <div class="sd-text">Shutting down…</div>
  </div>
  <button id="power-on" type="button" aria-label="Power On">
    <svg viewBox="0 0 24 24" width="34" height="34"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v8"/><path d="M7.200 6.300a8 8 0 1 0 9.600 0"/></g></svg>
  </button>
</div>

<audio id="bg-music" src="airlock.mp3" loop></audio>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="config.js"></script>

<!-- JS dipisah per fungsi (urutan ini penting) -->
<script src="js/core.js"></script>      <!-- state bersama, musik, label dari config -->
<script src="js/icons.js"></script>     <!-- daftar icon + pembuat icon -->
<script src="js/genie.js"></script>     <!-- animasi genie (tersedot ke dock) -->
<script src="js/clock.js"></script>     <!-- jam menu bar & lock screen -->
<script src="js/typing.js"></script>    <!-- animasi teks mengetik -->
<script src="js/login.js"></script>     <!-- login & reset sesi -->
<script src="js/popups.js"></script>    <!-- popup pesan, email, Spotify -->
<script src="js/explorer.js"></script>  <!-- App Explorer -->
<script src="js/dock.js"></script>      <!-- bikin dock dari config -->
<script src="js/shutdown.js"></script>  <!-- shut down / power on -->
</body>
</html>
